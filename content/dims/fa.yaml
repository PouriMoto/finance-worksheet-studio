user_need_focus:
  label: "تمرکز بر نیاز واقعی کاربر"
  high: { meaning: "در این تمرین بیشتر گزینه‌هایی را انتخاب کردی که از یک نیاز و دلیل بازگشت مشخص شروع می‌شد.", practice: "برای ایده‌ی بعدی یک جمله بنویس: کاربر در چه لحظه‌ای و با چه احساسی سراغ این محصول می‌آید؟" }
  mid: { meaning: "بخشی از انتخاب‌هایت از نیاز کاربر شروع شد و بخشی از امکانات یا محتوا.", practice: "پیش از هر ویژگی جدید بپرس: این ویژگی کدام نیاز تکرارشونده را برطرف می‌کند؟" }
  low: { meaning: "در این تمرین بیشتر انتخاب‌ها از فهرست امکانات یا حجم محتوا شروع شدند، نه از نیاز کاربر.", practice: "یک کاربر فرضی انتخاب کن و دو موقعیت واقعی بنویس که در آن‌ها به محصول تو نیاز پیدا می‌کند." }
friction_awareness:
  label: "توجه به سهولت انجام رفتار"
  high: { meaning: "در سناریوها اول سراغ ساده‌کردن مسیر رفتی.", practice: "یک مسیر محصولت را مرحله‌به‌مرحله بشمار و یک مرحله از آن را حذف کن." }
  mid: { meaning: "گاهی ساده‌سازی را مقدم دانستی و گاهی سراغ انگیزه و یادآور رفتی.", practice: "پیش از افزودن یادآور یا پاداش، زمان و تلاش ذهنی مسیر فعلی را اندازه بگیر." }
  low: { meaning: "در این تمرین بیشتر سراغ انگیزه و یادآور رفتی تا سهولت انجام کار.", practice: "برای یک رفتار، شش عامل سهولت (زمان، پول، تلاش بدنی، تلاش ذهنی، هنجار اجتماعی، خروج از روال) را مرور کن و سخت‌ترین را پیدا کن." }
ethical_design:
  label: "طراحی ارزش‌محور"
  high: { meaning: "در این تمرین بازگشت کاربر را از ارزش واقعی دنبال کردی، نه از فشار یا فریب.", practice: "برای هر مکانیزم بازگشت بپرس: اگر کاربر دلیلش را بداند، باز هم آن را منصفانه می‌داند؟" }
  mid: { meaning: "بعضی انتخاب‌هایت ارزش‌محور بود و بعضی به فشار یا تصادف تکیه داشت.", practice: "مکانیزم‌های یادآوری محصولت را فهرست کن و آن‌هایی را که به احساس گناه یا ترس تکیه دارند بازنویسی کن." }
  low: { meaning: "در این تمرین چند بار گزینه‌ای را انتخاب کردی که با فشار یا پاداش تصادفی کاربر را نگه می‌دارد.", practice: "یک پیام یادآور را طوری بازنویسی کن که فقط مسیر و ارزش قدم بعدی را نشان بدهد." }
long_term_thinking:
  label: "نگاه بلندمدت"
  high: { meaning: "در این تمرین پیامدهای دورتر را بیشتر از نتیجه‌ی فوری در نظر گرفتی.", practice: "برای تصمیم بعدی، پیامد یک‌ماهه و یک‌ساله‌ی هر گزینه را کنار هم بنویس." }
  mid: { meaning: "گاهی پیامد فوری و گاهی پیامد بلندمدت در انتخاب‌هایت وزن بیشتری داشت.", practice: "پیش از هر انتخاب مهم، یک جمله بنویس: یک سال بعد از این تصمیم چه می‌شود؟" }
  low: { meaning: "در این تمرین نتیجه‌ی فوری بیشتر از پیامد دورتر در انتخاب‌هایت دیده شد.", practice: "پیش از انتخاب دو جمله بنویس: یک ماه بعد چه می‌شود؟ یک سال بعد چه می‌شود؟" }
process_over_outcome:
  label: "قضاوت تصمیم بر پایه‌ی فرایند"
  high: { meaning: "تصمیم‌ها را بیشتر با کیفیت منطق و اطلاعاتشان سنجیدی تا با نتیجه‌ی نهایی.", practice: "برای هر تصمیم مالی یک یادداشت کوتاه بنویس: چرا؟ با چه شواهدی؟ اگر اشتباه کنم چه می‌شود؟" }
  mid: { meaning: "گاهی فرایند را مقدم دانستی و گاهی نتیجه را.", practice: "بعد از هر تصمیم، جدا از سود و زیان، کیفیت فرایند را از ۱ تا ۵ نمره بده." }
  low: { meaning: "در این تمرین بیشتر نتیجه‌ی نهایی ملاک قضاوت تو بود.", practice: "یک تصمیم گذشته‌ات را بردار و بنویس: با اطلاعات همان روز، منطقی بود؟" }
evidence_use:
  label: "تکیه بر شواهد و محاسبه"
  high: { meaning: "بیشتر انتخاب‌هایت به محاسبه یا شواهد تکیه داشت.", practice: "پیش از تصمیم بعدی، دو عدد مشخص (مثلاً ارزش برآوردی و قیمت) را کنار هم بنویس." }
  mid: { meaning: "گاهی به شواهد تکیه کردی و گاهی به شنیده‌ها یا روند قیمت.", practice: "هر بار که تصمیم از حرف دیگران آمد، یک منبع قابل‌بررسی کنارش پیدا کن." }
  low: { meaning: "در این تمرین انتخاب‌هایت بیشتر از روند قیمت یا حرف دیگران آمد تا از محاسبه.", practice: "یک سؤال را با عدد جواب بده: ارزشی که برای این دارایی تخمین می‌زنم چقدر است و بر چه پایه‌ای؟" }
risk_awareness:
  label: "آگاهی از ریسک"
  high: { meaning: "در این تمرین پیش از هر چیز به پیامد اشتباه و حفاظت از سرمایه فکر کردی.", practice: "برای هر تصمیم، سناریوی بد را بنویس و بسنج که تحملش را داری یا نه." }
  mid: { meaning: "گاهی به سناریوی بد توجه کردی و گاهی فقط به سناریوی خوب.", practice: "پیش از هر انتخاب یک جمله بنویس: بدترین نتیجه‌ی معقول چیست؟" }
  low: { meaning: "در این تمرین کمتر به سناریوی بد و حفاظت از سرمایه توجه شد.", practice: "پیش از انتخاب بپرس: اگر پیش‌بینی من غلط باشد چه چیزی از دست می‌دهم؟" }
concept_mastery:
  label: "تسلط بر مفهوم‌ها"
  high: { meaning: "در این تمرین بیشتر پاسخ‌های امتیازدار را درست دادی.", practice: "یکی از مفهوم‌ها را بدون نگاه‌کردن برای یک نفر توضیح بده؛ همان‌جا که گیر کردی بخش بعدی مرورت است." }
  mid: { meaning: "نیمی از پاسخ‌های امتیازدار درست بود و نیمی نه.", practice: "پاسخ‌هایی را که اشتباه بود دوباره بخوان و برای هرکدام یک مثال از زندگی خودت بنویس." }
  low: { meaning: "در این تمرین بیشتر پاسخ‌های امتیازدار نادرست بود.", practice: "بخش را یک بار دیگر و آهسته‌تر انجام بده؛ این بار پیش از انتخاب، مفهوم را با کلمات خودت بگو." }
