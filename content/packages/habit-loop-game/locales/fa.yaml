package:
  title: چرخه‌ی عادت
  subtitle: بازی کوتاه درباره‌ی ساختار عادت‌ها
  description: محرک، رفتار و پاداش را در موقعیت‌های روزمره پیدا کن و ببین چرا فقط «اراده» برای تغییر عادت کافی نیست.
parts:
  part-1:
    title: چرخه‌ی عادت
    summary: عادت از سه تکه ساخته می‌شود.
    scenes:
      s1-intro:
        body: چرا فقط «اراده» کافی نیست؟ تصور کن هزارباره یه کاری رو انجام دادی — بدونِ اینکه حتی تصمیم بگیری. یه چرخه‌ی خودکار
          پشتشه. بیا با هم بازش کنیم.
      s2-loop1:
        body: 'قدمِ ۱ — این عادت رو مرتب کن: «صبح از خواب بیدار می‌شی و بدونِ فکرکردن، گوشی رو چک می‌کنی و اینستاگرام رو باز
          می‌کنی.» این سه تیکه رو به‌ترتیبِ درست بچین:'
      s2b-loop1-sort:
        prompt: 'قدمِ ۱ — این عادت رو مرتب کن: «صبح از خواب بیدار می‌شی و بدونِ فکرکردن، گوشی رو چک می‌کنی و اینستاگرام رو
          باز می‌کنی.» این سه تیکه رو به‌ترتیبِ درست بچین:'
        items:
          i1: گوشی رو باز می‌کنی و فیدِ اینستاگرام رو نگاه می‌کنی
          i2: چند دقیقه حسِ سرگرمی و آرامشِ لحظه‌ای می‌گیری
          i3: صدای نوتیفیکیشن یا فقط دیدنِ گوشی روی میز
      s3-loop2:
        body: 'قدمِ ۲ — یه بارِ دیگه، با یه عادتِ دیگه: «شبی که تنها جلوی تلویزیون نشستی، ناخودآگاه بلند می‌شی و سراغِ یخچال
          می‌ری.» این‌بار خودت، بدونِ کمک، مرتبش کن:'
      s3b-loop2-sort:
        prompt: 'قدمِ ۲ — یه بارِ دیگه، با یه عادتِ دیگه: «شبی که تنها جلوی تلویزیون نشستی، ناخودآگاه بلند می‌شی و سراغِ یخچال
          می‌ری.» این‌بار خودت، بدونِ کمک، مرتبش کن:'
        items:
          i1: حسِ لذت و پرشدنِ خلأِ لحظه‌ای می‌گیری
          i2: حسِ تنهایی و بی‌کاریِ شبانه
          i3: بلندشدن و خوردنِ یه‌چیزِ شیرین
      s4-model:
        body: 'قدمِ ۳ — این چرخه یه اسمِ علمی داره: روانشناسانِ رفتاری از دهه‌ها پیش (با ریشه در کارِ اسکینر روی شرطی‌سازیِ
          عامل) این چرخه رو با ۴ بخش توضیح می‌دن: محرک → ولع → واکنش → پاداش. این چرخه خودکار و ناخودآگاه عمل می‌کنه — برای
          همینه که فقط «تصمیم‌گرفتن» کافی نیست. حالا محرک‌ها رو بشناسیم؛ محرک‌ها معمولاً یکی از این ۵ نوعن: زمان، مکان، حالتِ
          احساسی، رفتارِ قبلی، یا افرادِ اطراف.'
      s5-cue1:
        prompt: هر شب دقیقاً ساعتِ ۱۱ همون موقع سراغِ گوشی می‌ری. این محرک از کدوم دسته‌ست؟
        options:
          o1:
            label: زمان
            feedback: درسته!
          o2:
            label: مکان
            feedback: 'جوابِ درست: «زمان»'
          o3:
            label: حالتِ احساسی
            feedback: 'جوابِ درست: «زمان»'
          o4:
            label: رفتارِ قبلی
            feedback: 'جوابِ درست: «زمان»'
          o5:
            label: افرادِ اطراف
            feedback: 'جوابِ درست: «زمان»'
  part-2:
    title: شناخت محرک‌ها
    summary: محرک از کجا می‌آید؟
    scenes:
      s5-cue2:
        prompt: وقتی وارد آشپزخونه می‌شی، ناخودآگاه سراغِ یخچال می‌ری. این محرک از کدوم دسته‌ست؟
        options:
          o1:
            label: زمان
            feedback: 'جوابِ درست: «مکان»'
          o2:
            label: مکان
            feedback: درسته!
          o3:
            label: حالتِ احساسی
            feedback: 'جوابِ درست: «مکان»'
          o4:
            label: رفتارِ قبلی
            feedback: 'جوابِ درست: «مکان»'
          o5:
            label: افرادِ اطراف
            feedback: 'جوابِ درست: «مکان»'
      s5-cue3:
        prompt: وقتی حوصله‌ت سر می‌ره، سیگار روشن می‌کنی. این محرک از کدوم دسته‌ست؟
        options:
          o1:
            label: زمان
            feedback: 'جوابِ درست: «حالتِ احساسی»'
          o2:
            label: مکان
            feedback: 'جوابِ درست: «حالتِ احساسی»'
          o3:
            label: حالتِ احساسی
            feedback: درسته!
          o4:
            label: رفتارِ قبلی
            feedback: 'جوابِ درست: «حالتِ احساسی»'
          o5:
            label: افرادِ اطراف
            feedback: 'جوابِ درست: «حالتِ احساسی»'
      s5-cue4:
        prompt: بعدِ اینکه دندوناتو مسواک زدی، یه شیرینیِ کوچیک می‌خوری. این محرک از کدوم دسته‌ست؟
        options:
          o1:
            label: زمان
            feedback: 'جوابِ درست: «رفتارِ قبلی»'
          o2:
            label: مکان
            feedback: 'جوابِ درست: «رفتارِ قبلی»'
          o3:
            label: حالتِ احساسی
            feedback: 'جوابِ درست: «رفتارِ قبلی»'
          o4:
            label: رفتارِ قبلی
            feedback: درسته!
          o5:
            label: افرادِ اطراف
            feedback: 'جوابِ درست: «رفتارِ قبلی»'
      s5-cue5:
        prompt: وقتی با یه دوستِ خاص هستی، سیگار می‌کشی — درحالی‌که تنها اصلاً سراغش نمی‌ری. این محرک از کدوم دسته‌ست؟
        options:
          o1:
            label: زمان
            feedback: 'جوابِ درست: «افرادِ اطراف»'
          o2:
            label: مکان
            feedback: 'جوابِ درست: «افرادِ اطراف»'
          o3:
            label: حالتِ احساسی
            feedback: 'جوابِ درست: «افرادِ اطراف»'
          o4:
            label: رفتارِ قبلی
            feedback: 'جوابِ درست: «افرادِ اطراف»'
          o5:
            label: افرادِ اطراف
            feedback: درسته!
      s6-battery:
        body: 'قدمِ ۵ — اراده، مثلِ باتریِ گوشیه. ساعتِ روز رو جابه‌جا کن و ببین «باتریِ اراده» چطور تغییر می‌کنه.


          هرچی به آخرِ روز نزدیک‌تر بشی، انرژیِ خودکنترلی‌ت (باتریِ اراده) بیشتر تحلیل رفته — برای همینه که شب‌ها مقاومت در
          برابرِ وسوسه سخت‌تره.'
      s7-curve:
        body: 'قدمِ ۶ — ولع، همیشگی نمی‌مونه: حتی قوی‌ترین ولع‌ها معمولاً بعدِ چند دقیقه خودشون فروکش می‌کنن، مثلِ یه موج
          که بالا می‌ره و بعد می‌شکنه. اگه به‌جای واکنشِ فوری فقط چندلحظه صبر کنی، اغلب می‌بینی که شدتِ ولع به‌طرزِ عجیبی
          کم می‌شه.'
      s8-wait:
        body: 'قدمِ ۷ — یه تمرینِ کوچیک: دفعه‌ی بعد که یه ولعِ قوی داشتی، به‌جای واکنشِ فوری، فقط ۱۰ ثانیه صبر کن و ببین چی
          می‌شه. اغلب همون چندثانیه کافیه تا شدتش بشکنه.'
  part-3:
    title: عادت در زندگی خودت
    summary: مرور و جمع‌بندی
    scenes:
      s9-examples:
        body: 'قدمِ ۸ — این چرخه توی زندگیِ ما کجاست؟ (۱) چای/سیگار بعدِ غذا: محرک= تموم‌شدنِ غذا، پاداش= حسِ کامل‌شدنِ وعده.
          (۲) چک‌کردنِ گوشی وسطِ کار: محرک= یه لحظه سکوت یا گیرکردن، پاداش= محتوای تازه. (۳) خوردنِ تنقلات وسطِ درس‌خوندن:
          محرک= نشستن پشتِ میز، پاداش= یه وقفه‌ی لذت‌بخش. (۴) چک‌کردنِ ایمیلِ کاری آخرِ هفته: محرک= نگرانیِ عقب‌افتادن، پاداش=
          کاهشِ موقتیِ اضطراب.'
      s10-quiz1:
        prompt: موقعِ رانندگی، ماشین جلوت چراغ‌ترمز می‌زنه و تو بی‌اختیار پاتو می‌ذاری روی ترمز. «چراغ‌ترمز» کدوم بخشه؟
        options:
          o1:
            label: محرک
            feedback: درسته! این نشونه‌ایه که کلِ چرخه رو راه می‌ندازه.
          o2:
            label: واکنش
            feedback: در واقع این محرکه — نشونه‌ای که چرخه رو شروع می‌کنه.
          o3:
            label: پاداش
            feedback: در واقع این محرکه — نشونه‌ای که چرخه رو شروع می‌کنه.
      s10-quiz2:
        prompt: بعدِ یه روزِ سخت، به خودت شکلات می‌دی و حسِ آرامش می‌گیری. «حسِ آرامش» کدوم بخشه؟
        options:
          o1:
            label: محرک
            feedback: در واقع این پاداشه — چیزی که این رفتار رو تقویت می‌کنه.
          o2:
            label: واکنش
            feedback: در واقع این پاداشه — چیزی که این رفتار رو تقویت می‌کنه.
          o3:
            label: پاداش
            feedback: درسته! این چیزیه که مغز ازش یاد می‌گیره این چرخه ارزشِ تکرار داره.
      s10-quiz3:
        prompt: هر بار وقتِ استرس، ناخنت رو می‌جوی. «جویدنِ ناخن» کدوم بخشه؟
        options:
          o1:
            label: محرک
            feedback: در واقع این واکنشه — رفتاری که در پاسخ به محرک انجام می‌شه.
          o2:
            label: واکنش
            feedback: درسته! این خودِ رفتاریه که در پاسخ به محرک (استرس) اتفاق می‌افته.
          o3:
            label: پاداش
            feedback: در واقع این واکنشه — رفتاری که در پاسخ به محرک انجام می‌شه.
      s10-quiz4:
        prompt: وقتی وارد اتاقِ خواب می‌شی، هر بار همون لحظه یادِ گوشی می‌افتی. این محرک از کدوم دسته‌ست؟
        options:
          o1:
            label: مکان
            feedback: درسته! خودِ فضا (اتاقِ خواب) محرکه — نه احساس یا آدمِ خاصی.
          o2:
            label: حالتِ احساسی
            feedback: در واقع این یه محرکِ مکانیه — خودِ فضا باعثِ شروعِ عادت می‌شه.
          o3:
            label: افرادِ اطراف
            feedback: در واقع این یه محرکِ مکانیه — خودِ فضا باعثِ شروعِ عادت می‌شه.
      s11-reflect:
        body: 'قدمِ ۱۰ — حالا نوبتِ عادتِ خودته. یه لحظه (فقط تو ذهنت، جایی ذخیره نمی‌شه) به یکی از عادت‌های خودت فکر کن:
          محرکش چیه؟ خودِ واکنش چیه؟ و چه پاداشی ازش می‌گیری؟'
      s12-summary:
        body: 'جمع‌بندی: عادت رو نمی‌شه با اراده «شکست داد» — باید محرک‌ها و واکنش‌ها رو دست‌کاری کرد، و یاد گرفت که ولع،
          هرچقدر هم قوی، بالاخره فروکش می‌کنه. (درسِ بعدی: نقشه‌برداریِ عادت‌های خودت.)'
rewards:
- title: نکته‌ی تازه
  body: برای تغییر یک عادت، اول محرکش را پیدا کن؛ بعد پاداش را عوض کن.
- title: نکته‌ی تازه
  body: عادت‌ها معمولاً با «محیط» شروع می‌شوند، نه با تصمیم.
- title: نکته‌ی تازه
  body: رفتار تکراری یعنی یک حلقه؛ حلقه را بنویس تا ببینی.
