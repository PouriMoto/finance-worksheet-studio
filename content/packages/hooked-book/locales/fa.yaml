package:
  title: 'قلاب‌شده: محصولی که کاربر برمی‌گردد'
  subtitle: تجربه‌ی تعاملی کتاب Hooked
  description: در چهار بخش کوتاه، مدل Hook (محرک، اقدام، پاداش متغیر، سرمایه‌گذاری) را با تصمیم‌گیری درباره‌ی محصول‌های فرضی تمرین می‌کنی و در پایان گزارشی از شیوه‌ی فکرت می‌گیری.
  author:
    name: نیر ایال (Nir Eyal)
    bio: 'نویسنده‌ی Hooked: How to Build Habit-Forming Products که با همکاری رایان هوور نوشته شده و مدل چهارمرحله‌ی Hook را برای ساخت محصولات عادت‌ساز معرفی می‌کند.'
parts:
  habit-zone:
    title: منطقه‌ی عادت
    summary: چه محصولی دلیل برگشت دارد؟
    scenes:
      author:
        title: با کتاب و نویسنده
        body: 'نیر ایال، با همکاری رایان هوور، کتاب Hooked را حول یک پرسش نوشته است: چطور محصولی بسازیم که مردم بارها خودشان به آن برگردند؟


          مدل کتاب چهار قدم دارد: محرک، اقدام، پاداش متغیر و سرمایه‌گذاری. این تجربه به‌جای حفظ‌کردن تعریف‌ها، تو را وارد تصمیم‌گیری درباره‌ی محصول‌های فرضی می‌کند.'
      product-types:
        prompt: کدام محصول ظرفیت بیشتری دارد که کاربر چند بار به آن برگردد؟
        options:
          a:
            label: ابزار آنلاین تبدیل PDF به Word
            feedback: کاربر کارش را می‌کند و می‌رود؛ تا نیاز بعدی پیش نیاید دلیلی برای بازگشت نیست.
          b:
            label: ابزاری که هر هفته درآمد، هزینه و پیشرفت هدف مالی را بررسی می‌کند
            feedback: درست؛ نیاز تکرارشونده و دلیل روشن برای مراجعه‌ی بعدی دارد.
          c:
            label: سایت بررسی قیمت خودرو
            feedback: فقط هنگام خرید خودرو به آن نیاز دارند؛ بقیه‌ی سال دلیلی برای بازگشت نیست.
        explain: تکرار نیاز و ارزش واقعی هر دو لازم‌اند؛ استفاده‌ی مکرر از چیزی بی‌فایده عادت پایدار نمی‌سازد.
      measure-product:
        prompt: محصول آموزشی‌ات را با کدام معیار می‌سنجی؟
        options:
          a:
            label: تعداد ویژگی‌ها و امکانات
            feedback: فهرست امکانات نمی‌گوید کاربر چرا برمی‌گردد.
          b:
            label: اینکه کاربر چه دلیلی دارد دوباره بیاید
            feedback: همین سؤال طراحی را از امکانات به رفتار می‌برد.
          c:
            label: حجم محتوا
            feedback: محتوای زیاد لزوماً به بازگشت منجر نمی‌شود.
      hook-order:
        prompt: چهار قدم چرخه‌ی Hook را به ترتیب بچین.
        items:
          trigger: محرک
          action: اقدام
          reward: پاداش متغیر
          investment: سرمایه‌گذاری
        explain: به همین ترتیب؛ و سرمایه‌گذاری کاربر می‌تواند ارزش استفاده‌ی بعدی را بیشتر کند.
      one-sentence:
        prompt: 'یک جمله بنویس: کاربر ایده‌ی تو چه زمانی و چرا دوباره برمی‌گردد؟'
        placeholder: 'مثلاً: هر بار که نگران پولش می‌شود...'
  trigger-action:
    title: محرک و اقدام
    summary: چه چیزی کاربر را می‌آورد و چطور شروع را آسان کنیم؟
    scenes:
      two-triggers:
        title: دو نوع محرک
        body: 'محرک بیرونی از محیط می‌رسد: اعلان، ایمیل، لینک یک دوست یا تبلیغ.


          محرک درونی از خود فرد می‌آید: نگرانی، کنجکاوی، بی‌حوصلگی یا میل به پیشرفت. کتاب روی محرک درونی تأکید بیشتری دارد، چون محصول را به یک نیاز واقعی وصل می‌کند.'
      which-internal:
        prompt: کدام مثال محرک درونی است؟
        options:
          a:
            label: اعلانی که روی صفحه‌ی گوشی می‌آید
            feedback: این یک محرک بیرونی است.
          b:
            label: نگرانی از اینکه «پولم کجا رفت؟»
            feedback: درست؛ این احساس از درون فرد می‌آید.
          c:
            label: ایمیل تبلیغاتی یک فروشگاه
            feedback: این هم محرک بیرونی است.
        hints:
        - 'به این فکر کن: محرک از بیرون می‌رسد یا از احساس خود فرد؟'
        - اعلان و ایمیل از بیرون می‌رسند.
      reels-idea:
        prompt: 'موضوع ریلز: «چرا با وجود درآمد، پس‌انداز سخت است؟» کدام ایده‌ی متن جلوتر است؟'
        options:
          a:
            label: سخنرانی درباره‌ی اهمیت پس‌انداز
            feedback: مخاطب این را بارها شنیده؛ به تجربه‌ی لحظه‌ای او وصل نمی‌شود.
          b:
            label: 'بازتاب این تجربه: «ماه قبل درآمد داشتم، اما نمی‌دانم پولم کجا رفت»'
            feedback: درست؛ محرک درونی مخاطب را مستقیم لمس می‌کند.
          c:
            label: فهرست امکانات یک اپ مالی
            feedback: از امکانات شروع کرده‌ای، نه از نیاز.
      fogg:
        title: مدل رفتار فاگ
        body: 'رفتار وقتی رخ می‌دهد که سه چیز هم‌زمان باشند: انگیزه، توانایی (سهولت) و یک محرک.


          شش عامل سهولت: زمان، پول، تلاش بدنی، تلاش ذهنی، هنجار اجتماعی و خروج از روال. در محصول‌های دیجیتال معمولاً زمان و تلاش ذهنی بیشترین اثر را دارند.'
      friction-fix:
        prompt: ثبت یک هزینه شش مرحله دارد و کاربر علاقه‌مند است اما عقب می‌اندازد. اول چه می‌کنی؟
        options:
          a:
            label: اعلان‌های بیشتر می‌فرستم
            feedback: محرک بیشتر، مسیر سخت را آسان نمی‌کند.
          b:
            label: مسیر را کوتاه می‌کنم و نتیجه را بلافاصله نشان می‌دهم
            feedback: درست؛ اول سهولت، بعد انگیزه و یادآور.
          c:
            label: یک متن انگیزشی اضافه می‌کنم
            feedback: کمی کمک می‌کند، اما مانع اصلی سر جایش است.
      first-step:
        prompt: کدام شروع، قدم اول را آسان‌تر می‌کند؟
        options:
          a:
            label: ثبت‌نام اجباری پیش از هر کاری
            feedback: قبل از اینکه ارزشی ببیند، مانع گذاشته‌ای.
          b:
            label: یک سؤال ملموس با عدد و نتیجه‌ی فوری
            feedback: درست؛ کاربر در چند ثانیه ارزش را حس می‌کند.
          c:
            label: توضیح طولانی درباره‌ی ویژگی‌ها
            feedback: تلاش ذهنی را بالا می‌برد.
  variable-reward:
    title: پاداش متغیر
    summary: چرا نتیجه‌ی تازه جذاب است و حد اخلاقی آن کجاست؟
    scenes:
      three-rewards:
        title: سه خانواده‌ی پاداش
        body: 'پاداش اجتماعی: دیده‌شدن، بازخورد گرفتن و مقایسه‌ی پیشرفت با دیگران.


          پاداش جست‌وجو: کشف اطلاعات یا سرنخ تازه.


          پاداش تسلط: حس پیشرفت و مهارت.


          در محصول آموزشی، بهترین تازگی از کشف، انتخاب و پیامد می‌آید، نه از وعده‌ی سود خیالی.'
      which-reward:
        prompt: کاربر نتیجه‌ی تصمیمش را با گروهی از بازیکنان مقایسه می‌کند. این کدام نوع پاداش است؟
        options:
          tribe:
            label: پاداش اجتماعی
            feedback: درست؛ به مقایسه و تعلق به گروه مربوط است.
          hunt:
            label: پاداش جست‌وجو
            feedback: جست‌وجو درباره‌ی کشف اطلاعات است، نه مقایسه با دیگران.
          self:
            label: پاداش تسلط
            feedback: تسلط درباره‌ی حس پیشرفت شخصی است.
      feedback-design:
        prompt: پایان یک سناریوی مالی است. کدام بازخورد را طراحی می‌کنی؟
        options:
          a:
            label: همیشه یک «آفرین» ثابت
            feedback: بعد از چند بار تکراری می‌شود و چیزی یاد نمی‌دهد.
          b:
            label: پیامد متناسب با انتخاب کاربر همراه با یک نکته‌ی تازه
            feedback: درست؛ تازگی از یادگیری می‌آید.
          c:
            label: وعده‌ی سود یا جایزه‌ی تصادفی
            feedback: کاربر را به ادامه‌ی اجباری می‌کشاند و با هدف آموزش نمی‌خواند.
      keep-users:
        prompt: برای نگه‌داشتن کاربر کدام را انتخاب می‌کنی؟
        options:
          a:
            label: پیام «استریک‌ات می‌سوزد!» با لحن ترسناک
            feedback: فشار می‌آورد و اعتماد را کم می‌کند.
          b:
            label: یادآور ملایم و مسیر روشن برای قدم بعدی
            feedback: درست؛ به کاربر احترام می‌گذارد و ارزش بعدی را نشان می‌دهد.
          c:
            label: پاداش تصادفی برای ادامه‌ی بی‌پایان
            feedback: به‌جای ارزش، به تصادف تکیه می‌کند.
      social-compare:
        prompt: می‌خواهی نتیجه‌ی کاربر را با دیگران مقایسه کنی. چطور؟
        options:
          a:
            label: رتبه‌بندی عمومی با نام و نقاط ضعف
            feedback: می‌تواند شرمندگی یا رقابت ناسالم بسازد.
          b:
            label: توزیع ناشناس انتخاب‌ها همراه با توضیح دلیل‌ها
            feedback: درست؛ مقایسه‌ی ایمن‌تر و آموزنده‌تر است.
          c:
            label: حذف کامل مقایسه
            feedback: امن است، اما از پاداش اجتماعی صرف‌نظر کرده‌ای.
      match-rewards:
        prompt: هر مثال را به خانواده‌ی پاداشش وصل کن.
        pairs:
          p1:
            left: مقایسه‌ی نتیجه‌ات با بقیه‌ی بازیکن‌ها
            right: پاداش اجتماعی
          p2:
            left: پیدا کردن اطلاعات تازه برای حل یک مسئله
            right: پاداش جست‌وجو
          p3:
            left: حس مهارت بعد از حل یک مسئله‌ی سخت
            right: پاداش تسلط
        explain: 'هر پاداش به یک نیاز متفاوت جواب می‌دهد: تعلق، کشف و پیشرفت.'
  investment:
    title: سرمایه‌گذاری کاربر
    summary: چه چیزی استفاده‌ی بعدی را ارزشمندتر می‌کند؟
    scenes:
      invest-intro:
        title: سرمایه‌گذاری یعنی چه؟
        body: 'در این مدل، سرمایه‌گذاری لزوماً پول نیست؛ می‌تواند زمان، اطلاعات، ترجیحات یا یک هدف باشد.


          نمونه: کاربر هدف مالی‌اش را ثبت می‌کند تا دفعه‌ی بعد پیشرفتش را ببیند. اگر این مشارکت واقعاً تجربه‌ی بعدی را شخصی‌تر کند، دلیل بازگشت معنادارتری ساخته‌ای.'
      which-investment:
        prompt: کدام مورد «سرمایه‌گذاری کاربر» است؟
        options:
          a:
            label: ثبت یک هدف مالی برای مراجعه‌ی بعد
            feedback: درست؛ کاربر چیزی وارد می‌کند که تجربه‌ی بعدی را شخصی‌تر می‌کند.
          b:
            label: دیدن یک تبلیغ
            feedback: این یک محرک بیرونی است، نه سرمایه‌گذاری.
          c:
            label: بستن اپلیکیشن
            feedback: کاری که چیزی برای استفاده‌ی بعدی نمی‌سازد.
      sticky-design:
        prompt: می‌خواهی کاربر کمتر برود. کدام را انتخاب می‌کنی؟
        options:
          a:
            label: خروج‌گرفتن از داده‌ها را سخت می‌کنم
            feedback: کاربر را گرفتار می‌کند، نه راضی.
          b:
            label: ثبت پیشرفت و ساخت یک برنامه‌ی شخصی که واقعاً به کارش بیاید
            feedback: درست؛ ماندن از ارزش می‌آید.
          c:
            label: هزینه‌ی خروج را بالا می‌برم
            feedback: به اعتماد کاربر آسیب می‌زند.
      goal:
        prompt: 'هدف خودت را برای دفعه‌ی بعد ثبت کن: می‌خواهی چه چیزی را بسنجی یا تمرین کنی؟'
        placeholder: 'مثلاً: ماه بعد وضعیت دوام مالی‌ام را دوباره بسنجم'
rewards:
- title: نکته‌ی تازه
  body: 'پیش از ساختن هر ویژگی بپرس: کاربر چه زمانی دوباره به این نیاز برمی‌خورد؟'
- title: نکته‌ی تازه
  body: ساده‌کردن یک مرحله اغلب بیشتر از یک یادآور اضافه جواب می‌دهد.
- title: نکته‌ی تازه
  body: بازگشتِ ارزشمند از یک نتیجه‌ی مفید می‌آید، نه از ترس از دست‌دادن.
