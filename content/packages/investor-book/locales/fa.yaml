package:
  title: "سرمایه‌گذار هوشمند: تصمیم‌گیری به‌جای هیجان"
  subtitle: "تجربه‌ی تعاملی کتاب بنجامین گراهام"
  description: "در سه بخش، تفاوت سرمایه‌گذاری و سفته‌بازی، اثر تورم و حاشیه‌ی امنیت را با مثال‌های عددی و تصمیم‌های کوتاه تمرین می‌کنی. اعداد مثال‌ها آموزشی و فرضی‌اند و توصیه‌ی سرمایه‌گذاری نیستند."
  author:
    name: "بنجامین گراهام (Benjamin Graham)"
    bio: "استاد سرمایه‌گذاری وارن بافت و از شاخص‌ترین چهره‌های سرمایه‌گذاری ارزشی. کتاب او بیش از آنکه درباره‌ی پیدا‌کردن سهم پرسود باشد، درباره‌ی ساختن یک سیستم تصمیم‌گیری است که جلوی هیجان و اعتمادبه‌نفس کاذب را بگیرد."
parts:
  investing-vs-speculating:
    title: "سرمایه‌گذاری یا سفته‌بازی؟"
    summary: "کیفیت تصمیم را با فرایند بسنج، نه فقط با نتیجه."
    scenes:
      author:
        title: "با کتاب و نویسنده"
        body: |-
          گراهام چارچوبی برای تحلیل، مدیریت ریسک و تصمیم‌گیری منطقی ارائه می‌کند. پیام اصلی کتاب این است: سیستمی بساز که تو را از ترس، طمع و اعتماد بیش‌ازحد به خودت نجات بدهد.

          مثال‌های این تجربه آموزشی‌اند و لزوماً اعداد تاریخی خود کتاب نیستند.
      two-people:
        prompt: "دو نفر سهم «الف» را ۵۰ هزار تومان می‌خرند. اولی صورت‌های مالی را تحلیل کرده و ارزش را حدود ۶۰ تا ۷۰ هزار برآورد کرده است. دومی دیده قیمت سهم از ۳۵ به ۵۰ رسیده و به حرف دوستش تکیه کرده. ماه بعد قیمت ۶۵ می‌شود. کدام تصمیم کیفیت بهتری داشت؟"
        options:
          a: { label: "نفر دوم؛ چون سود کرد", feedback: "سود یک ماه، کیفیت روش را ثابت نمی‌کند." }
          b: { label: "نفر اول؛ چون تصمیمش به تحلیل تکیه داشت", feedback: "درست؛ کیفیت تصمیم را با اطلاعات و منطق همان لحظه می‌سنجیم، نه فقط با نتیجه." }
          c: { label: "هر دو یکسان‌اند", feedback: "نتیجه یکسان بود، اما فرایندشان یکی نبود." }
        explain: "ممکن است تصمیمی ضعیف به نتیجه‌ی خوب برسد و تصمیمی منطقی به‌خاطر اتفاقی پیش‌بینی‌نشده زیان بدهد."
      definition:
        prompt: "کدام مورد جزو ویژگی‌های یک عملیات سرمایه‌گذاری (به تعریف گراهام) نیست؟"
        options:
          a: { label: "تکیه بر تحلیل دقیق", feedback: "این یکی از سه ویژگی است." }
          b: { label: "محافظت معقول از سرمایه در برابر زیان جدی", feedback: "این هم از ویژگی‌هاست." }
          c: { label: "تضمین سود", feedback: "درست؛ هیچ سرمایه‌گذاری سود تضمین‌شده ندارد." }
      before-buy:
        prompt: "پیش از خرید یک دارایی، کدام سؤال را مهم‌تر می‌دانی؟"
        options:
          a: { label: "دوستم گفته خوب است", feedback: "حرف دیگران شاهد نیست." }
          b: { label: "اگر پیش‌بینی‌ام اشتباه باشد چه بر سر سرمایه‌ام می‌آید؟", feedback: "درست؛ سناریوی بد را از همان ابتدا می‌سنجی." }
          c: { label: "چقدر بالا رفته است؟", feedback: "روند قیمت به‌تنهایی دلیل نیست." }
  inflation:
    title: "سرمایه‌گذار و تورم"
    summary: "پول اسمی و قدرت خرید یکی نیستند."
    scenes:
      nominal-real:
        title: "اسمی در برابر واقعی"
        body: |-
          اگر ۱۰۰ میلیون تومان را بدون سود نگه داری و تورم هر سال ۳۰ درصد باشد، عدد حساب تغییر نمی‌کند اما قدرت خریدش کم می‌شود.

          با لغزنده‌ها ببین قدرت خرید به پول امروز چقدر می‌شود. تورم واقعی معمولاً ثابت نمی‌ماند، پس این فقط یک سناریوست.
      coin-sim:
        prompt: "مبلغ، نرخ تورم و تعداد سال را تغییر بده."
        inputs:
          amount: { label: "مبلغ نگه‌داری‌شده (میلیون تومان)" }
          inflation: { label: "تورم سالانه (درصد)" }
          years: { label: "تعداد سال" }
        explain: "قدرت خرید به پول امروز = مبلغ ÷ (۱ + نرخ تورم) به توان تعداد سال."
      gold-real-return:
        prompt: "قیمت طلا در یک سال ۲۵ درصد بالا رفته و تورم همان سال ۳۰ درصد بوده. بازده واقعی تقریباً چقدر است؟"
        options:
          a: { label: "حدود ۲۵ درصد مثبت", feedback: "این بازده اسمی است، نه واقعی." }
          b: { label: "دقیقاً ۵ درصد منفی", feedback: "تفریق ساده نزدیک است اما دقیق نیست." }
          c: { label: "حدود ۳٫۸۵ درصد منفی", feedback: "درست؛ ۱٫۲۵ ÷ ۱٫۳۰ منهای یک، حدود ۳٫۸۵- می‌شود." }
      better-question:
        prompt: "کدام پرسش دقیق‌تر است؟"
        options:
          a: { label: "کدام دارایی ضد تورم است؟", feedback: "دنبال یک راه‌حل جادویی بودن، سیستم نمی‌سازد." }
          b: { label: "کدام ترکیب، با نیازها، افق زمانی و ریسک‌پذیری من، شانس بیشتری برای حفظ قدرت خرید دارد؟", feedback: "درست؛ از یک دارایی به یک سیستم می‌رسی." }
          c: { label: "هرچه گران‌تر شده بخرم", feedback: "این همان تکیه بر روند قیمت است." }
  margin-of-safety:
    title: "حاشیه‌ی امنیت و سبد"
    summary: "فضایی برای خطای تحلیل بساز و سبد را با قاعده بازبینی کن."
    scenes:
      idea:
        title: "حاشیه‌ی امنیت"
        body: |-
          فرض کن ارزش برآوردی یک سهم ۱۰۰ باشد. اگر آن را ۷۰ بخری، ۳۰ درصد پایین‌تر از ارزش برآوردی خریده‌ای.

          حاشیه‌ی امنیت = (ارزش برآوردی − قیمت خرید) ÷ ارزش برآوردی.

          این تضمین سود نیست؛ فقط فضایی برای اشتباه تحلیل می‌سازد. ارزش ذاتی هم مشاهده‌پذیر نیست و همیشه یک برآورد است.
      margin-sim:
        prompt: "ارزش برآوردی و قیمت خرید را تغییر بده."
        inputs:
          value: { label: "ارزش برآوردی هر سهم" }
          price: { label: "قیمت خرید هر سهم" }
        explain: "اگر قیمت بالاتر از ارزش برآوردی باشد، حاشیه‌ی امنیت منفی می‌شود."
      room-for-error:
        prompt: "ارزش برآوردی ۱۰۰ است. اگر ارزش واقعی ۸۵ باشد، کدام خرید هنوز فضای بیشتری برای خطا دارد؟"
        options:
          a: { label: "خرید با قیمت ۹۸", feedback: "با ارزش ۸۵ این خرید گران بوده است." }
          b: { label: "خرید با قیمت ۷۰", feedback: "درست؛ حتی با خطای برآورد، هنوز زیر ارزش واقعی خریده‌ای." }
          c: { label: "هر دو یکسان‌اند", feedback: "فاصله‌ی قیمت تا ارزش کاملاً متفاوت است." }
      cheap-but-weak:
        prompt: "سهمی بسیار ارزان است، اما شرکت زیان‌ده و بسیار بدهکار است. چه می‌کنی؟"
        options:
          a: { label: "می‌خرم چون ارزان است", feedback: "قیمت پایین به‌تنهایی کافی نیست." }
          b: { label: "کیفیت شرکت و میزان بدهی را هم بررسی می‌کنم", feedback: "درست؛ قیمت پایین و شرکت ضعیف می‌تواند باز هم زیان بدهد." }
          c: { label: "هر سهم ارزان را کنار می‌گذارم", feedback: "ارزان‌بودن مشکل نیست؛ مشکل نبود بررسی است." }
      rebalance-sim:
        prompt: "سبد ۵۰ درصد سهام و ۵۰ درصد درآمد ثابت است. اگر سهام رشد کند، ترکیب سبد چه می‌شود؟"
        inputs:
          growth: { label: "رشد سهام (درصد)" }
        explain: "حتی بدون خرید جدید، با رشد سهام سهم سهام در سبد بالا می‌رود."
      rebalance-choice:
        prompt: "سهم سهام از ۵۰ به حدود ۵۸ درصد رسیده است. سیاست از پیش تعیین‌شده‌ی تو ترکیب ۵۰ به ۵۰ است. چه می‌کنی؟"
        options:
          a: { label: "سهام بیشتر می‌خرم چون بالا می‌رود", feedback: "به روند قیمت تکیه کرده‌ای، نه به قاعده." }
          b: { label: "طبق قاعده‌ی از پیش تعیین‌شده سبد را به ۵۰ به ۵۰ برمی‌گردانم", feedback: "درست؛ هدف پیش‌بینی بازار نیست، بازگرداندن ریسک به میزان دلخواه است." }
          c: { label: "همه‌ی سهام را می‌فروشم", feedback: "این یک تصمیم هیجانی است، نه بازمتعادل‌سازی." }
rewards:
  - { title: "نکته‌ی تازه", body: "نتیجه‌ی یک معامله به‌تنهایی نمی‌گوید تصمیم درست بوده یا نه." }
  - { title: "نکته‌ی تازه", body: "ارزش ذاتی یک برآورد است؛ همیشه آن را با «برآورد من» بخوان." }
  - { title: "نکته‌ی تازه", body: "قاعده‌ی بازمتعادل‌سازی را پیش از هیجان بازار بنویس." }
