package:
  title: تا کی دوام می‌آوری؟
  subtitle: بازی کوتاه ذخیره‌ی اضطراری
  description: اگر درآمدت قطع شود، پس‌اندازت چند ماه از هزینه‌های ضروری را پوشش می‌دهد؟ با اعداد خودت بازی کن و یک گزارش کوچک از شیوه‌ی تصمیم‌گیری‌ات بگیر.
  about: '## این بازی چه می‌کند؟


    در هشت دقیقه، پس‌انداز و هزینه‌ی خودت را وارد می‌کنی و می‌بینی «دوام مالی» چند ماه است؛ بعد اولین حرکتت را وقتی درآمد قطع می‌شود انتخاب می‌کنی.


    ![هر بلوک یک ماه از هزینه‌های ضروری را پوشش می‌دهد](media:runway-game/shot-runway.svg "نمایش دوام مالی با بلوک‌های ماهانه")


    در پایان یک گزارش کوچک از شیوه‌ی تصمیم‌گیری‌ات می‌گیری.'
  gallery:
    runway-game/shot-runway.svg: دوام مالی با بلوک‌های ماهانه
    runway-game/shot-coin.svg: تورم قدرت خرید را کم می‌کند
parts:
  main:
    title: درآمد قطع شد
    summary: اندازه‌ی ذخیره را بسنج و اولین حرکتت را انتخاب کن.
    scenes:
      intro:
        title: فرض کن از فردا درآمد نداری
        body: 'حقوق قطع شده، اما اجاره و خرج خانه سر جایشان‌اند.


          سؤال اصلی ساده است: پس‌اندازت چند ماه از هزینه‌های ضروری را پوشش می‌دهد؟'
      runway:
        prompt: عددها را به وضعیت خودت نزدیک کن و ببین دوامت چند ماه می‌شود.
        inputs:
          savings:
            label: پس‌انداز نقد (میلیون تومان)
          expenses:
            label: هزینه‌ی ضروری ماهانه (میلیون تومان)
        explain: دوام مالی = پس‌انداز نقد ÷ هزینه‌ی ضروری ماهانه. این فقط یک تخمین ساده است و تورم و هزینه‌های غیرمنتظره را در نظر نمی‌گیرد.
      first-move:
        prompt: هفته‌ی اول است. اولین حرکتت چیست؟
        options:
          cut-flexible:
            label: هزینه‌های قابل‌حذف را اول کم می‌کنم
            feedback: این کار دوام را بدون وام یا ریسک تازه بیشتر می‌کند.
          borrow-now:
            label: فوراً قرض می‌گیرم تا سبک زندگی عوض نشود
            feedback: قرض می‌تواند فشار ماه‌های بعد را بیشتر کند؛ بهتر است اول هزینه‌ها را بسنجی.
          wait-and-see:
            label: صبر می‌کنم ببینم چه می‌شود
            feedback: صبر بدون برنامه، ماه‌های ذخیره را بی‌صدا مصرف می‌کند.
      cut-order:
        prompt: هزینه‌ها را از «اول حذف می‌کنم» تا «آخر حذف می‌کنم» بچین.
        items:
          groceries: خوراک روزانه
          subscriptions: اشتراک‌های غیرضروری
          rent: اجاره‌ی مسکن
          dining-out: غذای بیرون
        explain: 'ترتیب منطقی: اول اشتراک‌ها و غذای بیرون، بعد خوراک، و در آخر اجاره.'
      buffer-goal:
        prompt: برای دفعه‌ی بعد، کدام هدف ذخیره را انتخاب می‌کنی؟
        options:
          m3:
            label: ۳ ماه هزینه‌ی ضروری
          m6:
            label: ۶ ماه هزینه‌ی ضروری
          m12:
            label: ۱۲ ماه هزینه‌ی ضروری
rewards:
- title: نکته‌ی تازه
  body: ذخیره‌ی اضطراری را با هزینه‌ی ضروری بسنج، نه با درآمد.
- title: نکته‌ی تازه
  body: حذف یک اشتراک کوچک یک ماه به دوام مالی اضافه نمی‌کند، اما عادت بازبینی هزینه‌ها را می‌سازد.
- title: نکته‌ی تازه
  body: عدد مناسب ذخیره به ثبات شغل و تعهدات تو بستگی دارد؛ یک رقم یکسان برای همه وجود ندارد.
